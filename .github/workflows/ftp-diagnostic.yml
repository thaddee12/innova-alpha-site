name: Diagnostic FTP (lecture seule)

# Liste les dossiers visibles par le compte FTP, sans rien ecrire.
# Sert a choisir le bon dossier cible avant le premier deploiement.

on:
  workflow_dispatch:

jobs:
  lister:
    runs-on: ubuntu-latest
    steps:
      - name: Installer lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Lister les dossiers
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASS }}
        run: |
          lftp --env-password -u "$FTP_USER" -e "
            set ftp:ssl-allow yes; set ssl:verify-certificate no;
            set net:max-retries 2; set net:timeout 20;
            echo '== dossier de connexion'; pwd;
            echo '== racine'; cls -1;
            echo '== domains'; cls -1 domains/;
            echo '== domains/innovaalpha.com/public_html'; cls -la domains/innovaalpha.com/public_html/;
            bye" "$FTP_HOST"
