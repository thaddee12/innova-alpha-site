name: Diagnostic HTTP (lecture seule)

# Verifie ce que recoit un visiteur : codes HTTP, cache du CDN Hostinger,
# presence des dernieres modifications. Aucune ecriture.

on:
  workflow_dispatch:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - name: Contenu servi en ligne
        run: |
          NAV='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/128 Safari/537.36'
          for p in "" index.html conseil.html tarifs.html realisations.html apropos.html contact.html titres.css; do
            url="https://innovaalpha.com/$p"
            curl -sS -A "$NAV" -D /tmp/h -o /tmp/b --max-time 20 "$url" -w "== /$p code=%{http_code} taille=%{size_download}\n"
            grep -iE '^(x-hcdn-cache-status|cache-control|age|last-modified|etag):' /tmp/h | tr -d '\r' | sed 's/^/   /'
            echo "   data-hc: $(grep -o 'data-hc' /tmp/b | wc -l) | titres.css lie: $(grep -c 'href="titres.css"' /tmp/b) | LinkedIn: $(grep -o 'linkedin.com/company/innova-alpha' /tmp/b | wc -l) | Thaddée: $(grep -o 'Thaddée' /tmp/b | wc -l)"
          done
          echo "== meme page avec contournement de cache"
          curl -sS -A "$NAV" -D /tmp/h -o /tmp/b --max-time 20 "https://innovaalpha.com/index.html?nocache=$RANDOM" -w "code=%{http_code}\n"
          grep -iE '^(x-hcdn-cache-status|age):' /tmp/h | tr -d '\r' | sed 's/^/   /'
          echo "   data-hc: $(grep -o 'data-hc' /tmp/b | wc -l)"
