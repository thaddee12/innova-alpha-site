name: check-en-ligne
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Balises de description servies en ligne
        run: |
          set +e
          for u in "https://innovaalpha.com/" "https://innovaalpha.com/en/"; do
            echo "=== $u"
            curl -s --max-time 25 "$u" > /tmp/p.html
            grep -o '<meta name="description" content="[^"]*"' /tmp/p.html | head -1
            grep -o '<meta property="og:description" content="[^"]*"' /tmp/p.html | head -1
            grep -o '"description":"[^"]*"' /tmp/p.html | head -1
            grep -o '<title>[^<]*</title>' /tmp/p.html | head -1
          done
