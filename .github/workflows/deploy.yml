name: Deploiement innovaalpha.com

# Envoie le site sur l'hebergement Hostinger a chaque push sur main.
# Le compte FTP dedie est limite a domains/innovaalpha.com/public_html,
# d'ou server-dir "./".

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-innovaalpha
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Verifier les secrets FTP
        id: secrets
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASS" ]; then
            echo "Secrets FTP absents : deploiement ignore."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Recuperer le code
        if: steps.secrets.outputs.ok == 'true'
        uses: actions/checkout@v4

      - name: Envoyer par FTP
        if: steps.secrets.outputs.ok == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          port: 21
          protocol: ftps
          # certificat Hostinger emis pour un autre nom que l'IP : verification souple
          security: loose
          local-dir: ./
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            **/node_modules/**
